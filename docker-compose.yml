services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartdocumentfinder
      POSTGRES_USER: smartdocument
      POSTGRES_PASSWORD: smartdocument
    ports:
      - "5432:5432"
    volumes:
      - smartdocumentfinder_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdocument -d smartdocumentfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartdocumentfinder_postgres:
